<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screens</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1c1612; color: #f6efe4; font-family: Georgia, serif; }
    header { padding: 20px 16px 4px; max-width: 460px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    p { margin: 0; font-family: "Avenir Next", "Segoe UI", sans-serif; color: #e6d8c6; }
    main { max-width: 460px; margin: 0 auto; padding: 8px 12px 40px; }
    h2 { font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; margin: 22px 4px 8px; }
    img { width: 100%; height: auto; display: block; border-radius: 18px; background: #2a221c; }
  </style>
</head>
<body>
  <header>
    <h1>Look here</h1>
    <p>Scroll. These are the screens. They will not show inside the chat message.</p>
  </header>
  <main>
    <h2>Welcome</h2>
    <img src="welcome.jpg" alt="Welcome screen" />
    <h2>Enter the wild</h2>
    <img src="enter-wild.jpg" alt="Enter the wild screen" />
    <h2>Home</h2>
    <img src="home-clean.jpg" alt="Home screen" />
    <h2>A nudge</h2>
    <img src="nudge-clean.jpg" alt="Nudge screen" />
  </main>
</body>
</html>
